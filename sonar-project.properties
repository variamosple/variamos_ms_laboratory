# SonarCloud analysis run by the CI (build-and-test), with the coverage of
# the Jest tests, unit and PostgreSQL; automatic analysis is off. Files are
# listed one by one, so that nothing else of the repository is sent.
sonar.organization=variamosple-1
sonar.projectKey=variamosple_variamos_ms_laboratory

sonar.sources=src,migrations,Dockerfile,.github
sonar.tests=src,test-support
sonar.exclusions=src/**/*.test.ts
sonar.test.inclusions=src/**/*.test.ts,test-support/**

# Both runs of the CI: npm test, then npm run test:db
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/db/lcov.info
