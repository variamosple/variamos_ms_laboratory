name: variamos_ms_laboratory-main-aws-image

# Same steps as the other services of the platform: build and push jasotov/variamos_ms_laboratory:main,
# then pull it and recreate the service on the production server (DEPLOYMENT.md, section 3).
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deployment at a time: the service runs as a single instance (DEPLOYMENT.md, section 3)
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{vars.ACR_DOKCERHUB}}
          username: ${{secrets.ACRUSERNAME_DOKCERHUB}}
          password: ${{secrets.ACRUSERPASSWORD_DOKCERHUB}}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{vars.ACR_DOKCERHUB}}/${{secrets.ACRUSERNAME_DOKCERHUB}}/variamos_ms_laboratory:main
          file: ./Dockerfile

      - name: Deploy changes into the server
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master of 2026-08-16: v1.2.5 plus the drone-ssh checksum check
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.VARIAMOS_AWS_PEM }}
          script: |
            docker compose --env-file .env.aws.develop -f docker-compose-aws-develop-nginx.yml pull variamos_ms_laboratory
            docker compose --env-file .env.aws.develop -f docker-compose-aws-develop-nginx.yml up -d --force-recreate variamos_ms_laboratory

      # Alert only, as for the other services: a red run on main warns whoever merged; nothing is rolled
      # back. The service applies its migrations at start, then answers /health with "ok" once its
      # database answers.
      - name: Check the deployed service answers
        env:
          HEALTH_URL: https://app.variamos.com/variamos_ms_laboratory/health
        run: |
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            body=$(curl -sS --max-time 10 "$HEALTH_URL" || true)
            if echo "$body" | jq -e '.status == "ok"' >/dev/null 2>&1; then
              echo "variamos_ms_laboratory is up: $(echo "$body" | jq -c .)"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::variamos_ms_laboratory did not answer ok within 5 minutes"
              echo "Last answer: $(echo "$body" | head -c 500)"
              exit 1
            fi
            sleep 10
          done
